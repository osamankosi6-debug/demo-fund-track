name: Daily Demo Fund
on:
  schedule:
    - cron: '0 11 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - run: python demo_fund.py
      - run: |
          git config user.name "demo-bot"
          git config user.email "bot@demo.com"
          git add track_record.csv
          git diff --staged --quiet || git commit -m "auto NAV"
          git push
